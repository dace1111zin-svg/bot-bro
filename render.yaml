services:
  - type: web
    name: bot-bro
    env: python
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: MONGO_URI
        sync: false
      - key: DISCORD_TOKEN
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: PORT
        value: 10000
